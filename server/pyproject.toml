[project]
name = "freecad-mcp"
version = "0.1.0"
description = "MCP server that drives a live FreeCAD session through the ClaudeLink addon"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
freecad-mcp = "freecad_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freecad_mcp"]
